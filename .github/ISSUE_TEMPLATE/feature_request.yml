name: Feature request
description: Suggest something GitSwitcher could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way? Start here rather than with the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Rough is fine.
  - type: dropdown
    id: platforms
    attributes:
      label: Which systems does this matter on?
      multiple: true
      options: [macOS, Windows, Linux]
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
