name: Test

# release.yml only runs on version tags, so without this a regression is first
# discovered while cutting a release. Both systems, because the per-OS code
# (lib/src/platform/host.dart) only takes its Windows branches on Windows, and
# the Windows runner and tray patch only compile there.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'  # keep in step with release.yml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Proves the native code compiles against the committed deployment
      # targets — a newer local toolchain can raise them and hide errors,
      # which once surfaced only in the release build.
      - if: runner.os == 'macOS'
        run: flutter build macos --release
      - if: runner.os == 'Windows'
        run: flutter build windows --release
