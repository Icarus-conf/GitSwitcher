name: Release

# Cutting a release is deliberate, so this runs on a version tag rather than on
# every push to main. workflow_dispatch re-builds an existing tag, or with
# dry_run builds the dispatched branch without publishing anything — the way
# to try changes to this file.
#
# Shape: the two builds run in parallel and keep their zips as workflow
# artifacts; a separate publish job uploads them. GitHub's release API fails
# now and then (500/502/503), and when it does, re-running only the failed
# publish job re-uploads the same zips in seconds instead of rebuilding both.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true
      dry_run:
        description: 'Build the dispatched branch, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Pinned: an unexpected Flutter upgrade should not silently change what
  # ships. Keep in step with test.yml.
  FLUTTER_VERSION: '3.41.2'
  TAG: ${{ inputs.tag || github.ref_name }}
  # A re-build of a tag builds that tag; a dry run builds the branch it was
  # dispatched from. An empty ref means "whatever triggered this run".
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag || '' }}

jobs:
  macos:
    runs-on: macos-latest
    # GitHub's macOS machines are sometimes all busy; fail rather than hang.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          # pubspec's version is a placeholder; the tag is the real one. Strip
          # the leading v so it is a valid Dart build name.
          BUILD_NAME="${TAG#v}"
          if ! echo "$BUILD_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze

      # A release that fails its own test suite should not exist. This also
      # catches a vendored tray_manager that lost its patch.
      - run: flutter test

      # APP_VERSION is what the in-app update check compares against; builds
      # without it never nag.
      - name: Build
        run: |
          flutter build macos --release \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.build_name }}"

      - name: Verify the bundle carries the tag's version
        run: |
          PLIST="build/macos/Build/Products/Release/GitSwitcher.app/Contents/Info.plist"
          GOT=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          WANT="${{ steps.version.outputs.build_name }}"
          echo "bundle version: $GOT (expected $WANT)"
          [ "$GOT" = "$WANT" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Package
        run: |
          APP="build/macos/Build/Products/Release/GitSwitcher.app"
          mkdir -p dist
          # ditto, not zip: it preserves the bundle's symlinks and resource
          # forks, which a plain zip corrupts.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/GitSwitcher-$TAG-macos.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build
        run: |
          BUILD_NAME="${TAG#v}"
          flutter build windows --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$BUILD_NAME"

      - name: Package
        run: |
          OUT="build/windows/x64/runner/Release"
          test -f "$OUT/GitSwitcher.exe" || { echo "::error::$OUT/GitSwitcher.exe not found"; exit 1; }
          # The exe needs the DLLs and data/ beside it, so the whole folder
          # ships, inside a GitSwitcher/ folder rather than loose in the zip.
          mkdir -p stage dist && cp -R "$OUT" stage/GitSwitcher
          (cd stage && 7z a -tzip "../dist/GitSwitcher-$TAG-windows.zip" GitSwitcher > /dev/null)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [macos, windows]
    if: ${{ !inputs.dry_run }}
    # Publishing is a few API calls; any machine will do, and Linux ones are
    # the most plentiful.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # For the publish script and the release notes, so the tag's own copy.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tool/publish_release.sh "$TAG" dist/*.zip
