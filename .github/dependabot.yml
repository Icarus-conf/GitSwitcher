# Weekly update PRs, grouped so there's one to review rather than ten.
# CI tests and builds each one on macOS and Windows before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      packages:
        patterns: ["*"]
    ignore:
      # Vendored and patched in third_party/; upgrade with
      # tool/vendor_tray_manager.sh instead.
      - dependency-name: tray_manager
      # 0.7 needs Dart 3.14, newer than the Flutter version pinned in CI
      # (test.yml, release.yml). Remove this when that pin moves up.
      - dependency-name: window_manager
        versions: [">=0.6.0"]
